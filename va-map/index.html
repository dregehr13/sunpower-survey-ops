const SUFFIX = /^(rd|road|dr|drive|ln|lane|st|street|ct|court|way|pl|place|ave|avenue|blvd|cir|circle|trl|trail|ter|terrace|pkwy|hwy|aly|alley|run|path|loop|sq|xing|pt|bnd|cv|row|walk|rdg|ridge|hl|hls|knl|mnr|crk|br|byp|ext|spur|grn|gln|frst|vw|vis|hts|est|park|pike|tpke)\.?$/i;
function trimIfStreet(w){ for(let i=w.length-2;i>=0;i--) if(SUFFIX.test(w[i])) return w.slice(i+1).join(' '); return w.join(' '); }
function cityFromOne(w){ for(let i=w.length-2;i>=0;i--) if(SUFFIX.test(w[i])) return w.slice(i+1).join(' '); return w.slice(-1).join(' '); }

function buildData(){
  if (typeof RAW === 'undefined') return null;
  const va = RAW.filter(r => /^VA /.test(r.region || ''));

  const byZip = {};
  va.forEach(r => {
    const m = (r.address || '').match(/^(.*?),\s*VA\s+(\d{5})/);
    if (m) (byZip[m[2]] = byZip[m[2]] || []).push(m[1].trim().split(/\s+/));
  });
  function cityFor(zip){
    const L = byZip[zip];
    if (!L || !L.length) return zip;
    if (L.length === 1) return cityFromOne(L[0]);
    let c = L[0].slice();
    for (const w of L.slice(1)) {
      let n = 0;
      while (n < c.length && n < w.length &&
             c[c.length-1-n].toLowerCase() === w[w.length-1-n].toLowerCase()) n++;
      c = c.slice(c.length - n);
      if (!c.length) break;
    }
    if (!c.length) {
      const t = {};
      L.forEach(w => { const k = w[w.length-1]; t[k] = (t[k]||0)+1; });
      return Object.entries(t).sort((a,b) => b[1]-a[1])[0][0];
    }
    return trimIfStreet(c);
  }

  const dated = va.filter(r => r.start).map(r => r.start).sort();
  if (!dated.length) return null;
  const day0 = dated[0];
  const base = new Date(day0 + 'T12:00:00');
  const di = d => Math.round((new Date(d + 'T12:00:00') - base) / 864e5);

  const pts = [], totals = {};
  let unknownZip = 0;
  va.forEach(r => {
    const m = (r.address || '').match(/,\s*VA\s+(\d{5})/);
    if (!m || !r.start) return;
    const c = ZIPC[m[1]];
    if (!c) { unknownZip++; return; }
    const street = (r.address || '').replace(/,\s*VA\s+\d{5}.*$/, '').trim();
    pts.push([c[0], c[1], di(r.start), m[1], street]);
    totals[m[1]] = (totals[m[1]] || 0) + 1;
  });
  if (!pts.length) return null;

  const zipMeta = {};
  Object.keys(totals).forEach(z => { zipMeta[z] = { c: cityFor(z), n: totals[z], ll: ZIPC[z] }; });

  return { day0, lastDay: di(dated[dated.length-1]), pts, zipMeta,
           counties: COUNTIES, unknownZip, total: pts.length };
}

const DATA = buildData();

(function(){
  const sub = document.querySelector('.sub');
  if (!DATA) {
    if (sub) sub.textContent = 'No Virginia jobs in the current export.';
    document.querySelector('.mapwrap').style.display = 'none';
    document.querySelector('.tl').style.display = 'none';
    return;
  }
  const ts = (typeof DATA_TS !== 'undefined' && DATA_TS) ? DATA_TS.slice(0,10) : '';
  // Surface dropped rows rather than quietly under-reporting: a ZIP outside the
  // baked table would otherwise vanish from the map with no trace.
  const miss = DATA.unknownZip ? ' · ' + DATA.unknownZip + ' with an unrecognised ZIP not shown' : '';
  if (sub) sub.textContent = DATA.total + ' jobs by installation ZIP, scrubbed by Project Start Date'
    + (ts ? ' · data through ' + ts : '') + miss;
})();

.grp{min-width:0;}
.lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline;}
.lab-sp{margin-top:18px;}
.lab-n{font-family:var(--mono);letter-spacing:0;text-transform:none;}
.hint{margin:7px 0 0;font-size:11px;color:var(--muted);line-height:1.45;}

.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel);}
.seg-b{flex:1;font:inherit;font-size:11px;font-weight:600;padding:5px 0;border:0;
  background:transparent;color:var(--muted);cursor:pointer;}
.seg-b:hover{color:var(--ink);}
.seg-b.on{background:var(--ink);color:var(--paper);}
.seg-b:focus-visible,.play:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.hs{list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:0 22px;}
.hs li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 0;
  border-bottom:1px solid var(--line);align-items:baseline;}
.hs .c{font-size:12px;}
.hs .n{font-family:var(--mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.hs .z{grid-column:1/-1;font-family:var(--mono);font-size:10px;color:var(--faint);}
.hs .none{color:var(--faint);font-size:11.5px;padding:5px 0;}

.ramp{height:7px;border-radius:99px;
  background:linear-gradient(90deg,var(--land),var(--h1),var(--h2),var(--h3),var(--h4));}
.ramp-ends{display:flex;justify-content:space-between;margin-top:5px;
  font-size:10px;color:var(--faint);}

/* ── map ────────────────────────────────────────────────── */
.mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);overflow:hidden;}
#map{display:block;width:100%;height:auto;}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--ink);color:var(--paper);border-radius:var(--radius);
  padding:7px 9px;font-size:11px;line-height:1.5;max-width:230px;z-index:3;
  box-shadow:0 4px 14px rgba(0,0,0,.18);}
.tip.on{opacity:1;}
.tip b{font-size:12px;}
.tip .tz{font-family:var(--mono);opacity:.62;}
.tip .ta{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.16);
  opacity:.82;font-size:10.5px;}
.tip .ta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--faint);font-size:12px;pointer-events:none;}
/* class selector outranks the UA [hidden] rule, so restate it */
.empty[hidden]{display:none;}

/* ── timeline ───────────────────────────────────────────── */
.tl{display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid var(--line);}
.play{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;}
.play:hover{border-color:var(--muted);}
.play svg{fill:currentColor;margin-left:1px;}
.play.playing svg{margin-left:0;}
.track-wrap{position:relative;flex:1;min-width:0;height:46px;}
#hist{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#scrub{position:absolute;left:0;right:0;bottom:9px;width:100%;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer;}
#scrub::-webkit-slider-runnable-track{height:2px;background:var(--rule);border-radius:2px;}
#scrub::-moz-range-track{height:2px;background:var(--rule);border-radius:2px;}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);border:2px solid var(--panel);margin-top:-6px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);}
#scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.25);}
.ticks{position:absolute;left:0;right:0;bottom:-4px;height:12px;pointer-events:none;}
.ticks span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:var(--faint);
  font-family:var(--mono);white-space:nowrap;}

@media (max-width:760px){
  .main{grid-template-columns:1fr;}
  .rail{order:2;}
  .hd-r{width:100%;justify-content:space-between;}
}
@media (prefers-reduced-motion:reduce){
  .tip{transition:none;}
}
</style>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const MS_DAY = 864e5;
  const base = new Date(DATA.day0 + 'T12:00:00');
  const dateAt = i => new Date(base.getTime() + i * MS_DAY);
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const fmtShort = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

  const cv = $('#map'), ctx = cv.getContext('2d');
  const heat = document.createElement('canvas'), hctx = heat.getContext('2d', {willReadFrequently:true});
  const tip = $('#tip'), scrub = $('#scrub');

  let mode = 'cum', day = DATA.lastDay, playing = false, raf = 0;
  let W = 0, H = 0, dpr = 1, proj = null, hoverZip = null, countyPath = null;

  // ── projection: equirectangular, x compressed by cos(mid-lat). Virginia is
  // ~3° tall so a single scale factor is well within a pixel here.
  const bbox = (() => {
    let x0=180,y0=90,x1=-180,y1=-90;
    DATA.counties.forEach(rings => rings.forEach(r => r.forEach(([x,y]) => {
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    })));
    return {x0,y0,x1,y1};
  })();
  const kx = Math.cos((bbox.y0 + bbox.y1) / 2 * Math.PI / 180);

  function buildProj(w,h){
    const pad = 10;
    const gw = (bbox.x1 - bbox.x0) * kx, gh = bbox.y1 - bbox.y0;
    const s = Math.min((w - pad*2) / gw, (h - pad*2) / gh);
    const ox = (w - gw*s)/2, oy = (h - gh*s)/2;
    return {
      x: lon => ox + (lon - bbox.x0) * kx * s,
      y: lat => oy + (bbox.y1 - lat) * s,
      s
    };
  }

  // ── heat colour ramp, sampled to a 256-entry LUT once.
  const RAMP = [[0,232,217,176,0],[0.18,232,217,176,190],[0.42,201,148,46,225],
                [0.72,179,64,46,240],[1,125,35,24,252]];
  const LUT = (() => {
    const out = new Uint8ClampedArray(256*4);
    for(let i=0;i<256;i++){
      const t = i/255;
      let a = RAMP[0], b = RAMP[RAMP.length-1];
      for(let k=0;k<RAMP.length-1;k++){ if(t>=RAMP[k][0] && t<=RAMP[k+1][0]){ a=RAMP[k]; b=RAMP[k+1]; break; } }
      const span = (b[0]-a[0])||1, u = (t-a[0])/span;
      out[i*4]   = a[1]+(b[1]-a[1])*u;
      out[i*4+1] = a[2]+(b[2]-a[2])*u;
      out[i*4+2] = a[3]+(b[3]-a[3])*u;
      out[i*4+3] = a[4]+(b[4]-a[4])*u;
    }
    return out;
  })();

  function visiblePoints(){
    const lo = mode === 'win' ? day - 29 : -1;
    return DATA.pts.filter(p => p[2] <= day && p[2] >= lo);
  }

  function groupByZip(pts){
    const m = new Map();
    pts.forEach(p => {
      let e = m.get(p[3]);
      if(!e){ e = {zip:p[3], n:0, addrs:[], ll:[p[0],p[1]]}; m.set(p[3], e); }
      e.n++; e.addrs.push([p[4], p[2]]);
    });
    return m;
  }

  function resize(){
    const w = cv.parentElement.clientWidth;
    const ar = ((bbox.x1-bbox.x0)*kx) / (bbox.y1-bbox.y0);
    const h = Math.max(240, Math.round(w / ar));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px';
    heat.width = w*dpr; heat.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    hctx.setTransform(dpr,0,0,dpr,0,0);
    proj = buildProj(w,h);
    countyPath = new Path2D();
    DATA.counties.forEach(rings => rings.forEach(r => {
      r.forEach(([lon,lat],i) => { const x=proj.x(lon), y=proj.y(lat);
        i ? countyPath.lineTo(x,y) : countyPath.moveTo(x,y); });
      countyPath.closePath();
    }));
    draw();
  }

  function draw(){
    const pts = visiblePoints();
    const zips = groupByZip(pts);
    const css = getComputedStyle(document.documentElement);
    const land = css.getPropertyValue('--land').trim();
    const rule = css.getPropertyValue('--rule').trim();
    const ink  = css.getPropertyValue('--ink').trim();
    const paper= css.getPropertyValue('--panel').trim();

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = paper; ctx.fillRect(0,0,W,H);

    // counties: one path, so shared borders don't double-darken
    ctx.fillStyle = land; ctx.fill(countyPath, 'evenodd');
    ctx.strokeStyle = rule; ctx.lineWidth = 0.6; ctx.stroke(countyPath);

    // heat: additive alpha blobs, then colour-mapped through the LUT
    hctx.setTransform(dpr,0,0,dpr,0,0);
    hctx.clearRect(0,0,W,H);
    const maxN = Math.max(...[...zips.values()].map(z=>z.n), 1);
    // Tight enough that neighbouring metros stay distinguishable rather than
    // fusing into one blob across the Piedmont.
    const R = Math.max(11, Math.min(26, W/42));
    zips.forEach(z => {
      const x = proj.x(z.ll[1]), y = proj.y(z.ll[0]);
      const a = 0.30 + 0.70 * Math.sqrt(z.n / maxN);
      const g = hctx.createRadialGradient(x,y,0,x,y,R);
      g.addColorStop(0, 'rgba(0,0,0,'+a.toFixed(3)+')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      hctx.fillStyle = g;
      hctx.beginPath(); hctx.arc(x,y,R,0,Math.PI*2); hctx.fill();
    });
    if(zips.size){
      const img = hctx.getImageData(0,0,heat.width,heat.height);
      const d = img.data;
      for(let i=0;i<d.length;i+=4){
        const a = d[i+3];
        if(!a) continue;
        const o = a*4;
        d[i]=LUT[o]; d[i+1]=LUT[o+1]; d[i+2]=LUT[o+2]; d[i+3]=LUT[o+3]*(a/255);
      }
      hctx.putImageData(img,0,0);
      // Clip to the state before compositing — a ZIP centroid near the border
      // otherwise throws half its blob into Maryland or out over the Bay.
      // The clip is captured in device space, so it survives the transform reset.
      ctx.save();
      ctx.clip(countyPath, 'evenodd');
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(heat,0,0);
      ctx.restore();
    }

    // labels for the strongest clusters only — more than a handful is noise
    const top = [...zips.values()].sort((a,b)=>b.n-a.n).slice(0,7);
    ctx.font = '600 10.5px ' + css.getPropertyValue('--sans').trim();
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const placed = [];
    top.forEach(z => {
      const city = (DATA.zipMeta[z.zip]||{}).c || z.zip;
      const x = proj.x(z.ll[1]), y = proj.y(z.ll[0]) - 7;
      if(placed.some(p => Math.abs(p.x-x) < 54 && Math.abs(p.y-y) < 13)) return;
      placed.push({x,y});
      ctx.lineWidth = 3; ctx.strokeStyle = paper; ctx.strokeText(city, x, y);
      ctx.fillStyle = ink; ctx.fillText(city, x, y);
    });

    // hover marker
    if(hoverZip && zips.has(hoverZip)){
      const z = zips.get(hoverZip);
      ctx.beginPath();
      ctx.arc(proj.x(z.ll[1]), proj.y(z.ll[0]), 5, 0, Math.PI*2);
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.stroke();
    }

    $('#empty').hidden = zips.size > 0;
    paintRail(pts, zips);
  }

  function paintRail(pts, zips){
    const d = dateAt(day);
    $('#roDate').textContent = fmt(d);
    $('#roN').textContent = pts.length;
    $('#roSub').textContent = mode === 'win'
      ? 'from ' + fmtShort(dateAt(Math.max(0, day-29)))
      : 'since ' + fmtShort(dateAt(0));
    $('#hsN').textContent = zips.size ? zips.size + ' ZIPs' : '';

    const top = [...zips.values()].sort((a,b)=>b.n-a.n).slice(0,8);
    $('#hs').innerHTML = top.length
      ? top.map(z => {
          const meta = DATA.zipMeta[z.zip] || {};
          return '<li><span class="c">'+esc(meta.c||'—')+'</span><span class="n">'+z.n+'</span>'
               + '<span class="z">'+z.zip+'</span></li>';
        }).join('')
      : '<li class="none">Nothing in range</li>';
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ── timeline histogram: weekly volume drawn behind the track, so the shape
  // of the year is legible before you touch the control.
  function drawHist(){
    const c = $('#hist'), cx = c.getContext('2d');
    const w = c.parentElement.clientWidth, h = c.parentElement.clientHeight;
    const r = Math.min(window.devicePixelRatio||1, 2);
    c.width = w*r; c.height = h*r; cx.setTransform(r,0,0,r,0,0);
    cx.clearRect(0,0,w,h);
    const css = getComputedStyle(document.documentElement);
    const weeks = Math.ceil((DATA.lastDay+1)/7);
    const bins = new Array(weeks).fill(0);
    DATA.pts.forEach(p => bins[Math.floor(p[2]/7)]++);
    const max = Math.max(...bins,1);
    const bh = h - 16;
    const bw = w / weeks;
    for(let i=0;i<weeks;i++){
      if(!bins[i]) continue;
      const bhh = Math.max(2, (bins[i]/max)*bh);
      const active = (i*7) <= day;
      cx.fillStyle = active ? css.getPropertyValue('--h2').trim() : css.getPropertyValue('--rule').trim();
      cx.globalAlpha = active ? 0.85 : 0.5;
      cx.fillRect(i*bw+0.7, bh-bhh, Math.max(1.4,bw-1.4), bhh);
    }
    cx.globalAlpha = 1;
  }

  function drawTicks(){
    const el = $('#ticks'); el.innerHTML = '';
    const seen = new Set();
    for(let i=0;i<=DATA.lastDay;i++){
      const d = dateAt(i);
      if(d.getDate() !== 1) continue;
      const k = d.getMonth();
      if(seen.has(k)) continue;
      seen.add(k);
      const s = document.createElement('span');
      s.style.left = (i/DATA.lastDay*100) + '%';
      s.textContent = d.toLocaleDateString('en-US',{month:'short'});
      el.appendChild(s);
    }
  }

  // ── interaction
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const zips = groupByZip(visiblePoints());
    let best = null, bd = 22;
    zips.forEach(z => {
      const d = Math.hypot(proj.x(z.ll[1])-mx, proj.y(z.ll[0])-my);
      if(d < bd){ bd = d; best = z; }
    });
    if(!best){ if(hoverZip){ hoverZip=null; tip.classList.remove('on'); draw(); } return; }
    if(best.zip !== hoverZip){ hoverZip = best.zip; draw(); }
    const meta = DATA.zipMeta[best.zip] || {};
    const shown = best.addrs.slice().sort((a,b)=>b[1]-a[1]).slice(0,4);
    tip.innerHTML = '<b>'+esc(meta.c||best.zip)+'</b> <span class="tz">'+best.zip+'</span><br>'
      + best.n + ' job' + (best.n!==1?'s':'') + ' in view'
      + '<div class="ta">' + shown.map(a =>
          '<div>'+esc(a[0])+' &middot; '+fmtShort(dateAt(a[1]))+'</div>').join('')
        + (best.n>shown.length ? '<div>+'+(best.n-shown.length)+' more</div>' : '')
      + '</div>';
    tip.classList.add('on');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(Math.max(4, mx+13), W-tw-4) + 'px';
    tip.style.top  = Math.min(Math.max(4, my+13), H-th-4) + 'px';
  });
  cv.addEventListener('mouseleave', () => { hoverZip=null; tip.classList.remove('on'); draw(); });

  scrub.max = DATA.lastDay;
  scrub.addEventListener('input', () => { day = +scrub.value; stop(); draw(); drawHist(); });

  document.querySelectorAll('.seg-b').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg-b').forEach(o => {
      const on = o === b;
      o.classList.toggle('on', on);
      o.setAttribute('aria-pressed', String(on));
    });
    mode = b.dataset.mode;
    $('#modeHint').textContent = mode === 'win'
      ? 'Only what sold in the 30 days ending on this date.'
      : 'Everything sold up to this date.';
    draw();
  }));

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stop(){
    playing = false; cancelAnimationFrame(raf);
    $('#play').classList.remove('playing');
    $('#playIcon').setAttribute('d','M4 2.5v11l9-5.5z');
    $('#play').setAttribute('aria-label','Play timeline');
  }
  function play(){
    if(day >= DATA.lastDay) day = 0;
    playing = true;
    $('#play').classList.add('playing');
    $('#playIcon').setAttribute('d','M4 3h3.2v10H4zM8.8 3H12v10H8.8z');
    $('#play').setAttribute('aria-label','Pause timeline');
    let last = performance.now(), acc = 0;
    const step = now => {
      if(!playing) return;
      acc += now - last; last = now;
      // ~2.5 days per frame-tick keeps the full 7 months near 12 seconds
      while(acc > 26){ acc -= 26; day = Math.min(day+1, DATA.lastDay); }
      scrub.value = day;
      draw(); drawHist();
      if(day >= DATA.lastDay){ stop(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  $('#play').addEventListener('click', () => playing ? stop() : play());
  if(reduced) $('#play').title = 'Animation reduced per your system setting';

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); drawHist(); drawTicks(); }, 120); });
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener ? mq.addEventListener('change', () => { draw(); drawHist(); })
                       : mq.addListener(() => { draw(); drawHist(); }));
  new MutationObserver(() => { draw(); drawHist(); })
    .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

  resize(); drawHist(); drawTicks();
})();
</script>

<script>
(function(){
  if (typeof RAW === 'undefined') {
    document.body.innerHTML = '<p style="font:14px -apple-system,sans-serif;padding:40px;color:#6b665a">'
      + 'Could not load data.js. Reload, or re-run push.sh if this persists.</p>';
  }
})();
</script>
